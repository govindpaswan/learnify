# ONE SERVICE deployment - Express serves both API + React frontend
# This is the RECOMMENDED setup

services:
  - type: web
    name: learnify
    env: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Add manually in Render dashboard:
      # MONGO_URI, JWT_SECRET, CLIENT_URL,
      # ADMIN_EMAIL, ADMIN_PASSWORD,
      # CLOUDINARY_*, RAZORPAY_*, EMAIL_*
